<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Miei Giochi da Tavolo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎲 I Miei Giochi da Tavolo</h1>
    <p class="subtitle">Collezione personale — <span id="game-count"></span> giochi</p>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Cerca un gioco...">
    <select id="sort">
      <option value="name">Ordina per nome</option>
      <option value="rating">Ordina per rating BGG</option>
      <option value="year">Ordina per anno</option>
      <option value="players">Ordina per numero giocatori</option>
    </select>
  </div>

  <main id="grid" class="grid"></main>

  <p id="empty-state" class="empty-state" hidden>Nessun gioco trovato.</p>

  <footer>
    <p>Generato con dati da <a href="https://boardgamegeek.com" target="_blank" rel="noopener">BoardGameGeek</a> — ispirato a <a href="https://paolofantozzi.github.io/menu_giochi/" target="_blank" rel="noopener">Paolo Fantozzi</a></p>
  </footer>

<script src="app.js"></script>
</body>
</html>
